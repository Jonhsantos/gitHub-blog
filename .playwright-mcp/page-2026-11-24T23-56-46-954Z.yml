    - generic [ref=e84]:
      - heading "PRD / SPEC — GitHub Blog" [level=1] [ref=e85]
      - heading "1. Contexto" [level=2] [ref=e86]
      - paragraph [ref=e87]:
        - text: Aplicação web (SPA) que exibe um blog público a partir das
        - strong [ref=e88]: issues
        - text: de um repositório GitHub. O perfil do autor vem da API pública do GitHub (
        - code [ref=e89]: "GET /users/{username}"
        - text: ) e cada publicação é uma issue do repositório configurado (
        - code [ref=e90]: owner/repo
        - text: ). A aplicação deve funcionar sem token, backend, banco de dados, login ou edição de posts.
      - list [ref=e91]:
        - listitem [ref=e92]:
          - strong [ref=e93]: "Repositório fonte:"
          - code [ref=e94]: Jonhsantos/gitHub-blog
          - text: (público)
        - listitem [ref=e95]:
          - strong [ref=e96]: "Usuário/perfil:"
          - code [ref=e97]: Jonhsantos
        - listitem [ref=e98]:
          - strong [ref=e99]: "Idioma da interface:"
          - text: português do Brasil (pt-BR)
        - listitem [ref=e100]:
          - strong [ref=e101]: "Referência visual:"
          - text: Figma "GitHub Blog (Community) - Copy - cópia" (node
          - code [ref=e102]: 0:1
          - text: )
      - heading "2. Problema" [level=2] [ref=e103]
      - paragraph [ref=e104]: Estudantes e recrutadores precisam visualizar, em um layout amigável e responsivo, as publicações técnicas do autor a partir de um repositório GitHub, com busca, paginação e leitura individual de cada post, sem depender de infraestrutura própria.
      - heading "3. Público-alvo" [level=2] [ref=e105]
      - list [ref=e106]:
        - listitem [ref=e107]: Autor do blog (estudante de desenvolvimento web).
        - listitem [ref=e108]: Recrutadores e colegas que acessam o link público.
        - listitem [ref=e109]: Avaliadores da disciplina.
      - heading "4. Objetivo" [level=2] [ref=e110]
      - paragraph [ref=e111]: Entregar uma SPA responsiva que liste e exiba posts (issues) de um repositório GitHub público, com perfil do autor, busca com debounce e paginação remota, leitura em Markdown e estados de carregamento/erro/acesso direto.
      - heading "5. Fluxo principal" [level=2] [ref=e112]
      - paragraph [ref=e113]:
        - code [ref=e114]: Home → Busca → Detalhe → Voltar
      - list [ref=e115]:
        - listitem [ref=e116]: "Usuário acessa a Home: perfil do autor + lista de posts."
        - listitem [ref=e117]: Usuário pode buscar por texto (debounce 500 ms ou Enter).
        - listitem [ref=e118]:
          - text: "Usuário clica em um card: navega para"
          - code [ref=e119]: /post/:number
          - text: sem recarregar a página.
        - listitem [ref=e120]: "Na página de detalhe: lê o Markdown, vê metadados, pode voltar à lista preservando termo/página ou ir para a Home se acesso direto."
        - listitem [ref=e121]: Ao voltar, a lista mantém o termo de busca e a página anteriores.
      - heading "6. Requisitos Funcionais (RF)" [level=2] [ref=e122]
      - paragraph [ref=e123]: Cada RF possui critério verificável.
      - list [ref=e124]:
        - listitem [ref=e125]:
          - strong [ref=e126]: RF-01
          - text: Consultar
          - code [ref=e127]: "GET /users/{username}"
          - text: e exibir avatar (com
          - code [ref=e128]: alt
          - text: ), nome, bio,
          - code [ref=e129]: "@username"
          - text: ", seguidores e link de perfil."
          - emphasis [ref=e130]: "Critério:"
          - text: perfil renderizado com dados reais; valores nulos não quebram a UI (fallbacks).
        - listitem [ref=e131]:
          - strong [ref=e132]: RF-02
          - text: Tratar valores nulos do perfil (bio, name, avatar).
          - emphasis [ref=e133]: "Critério:"
          - text: se
          - code [ref=e134]: bio
          - text: /
          - code [ref=e135]: name
          - text: for
          - code [ref=e136]: "null"
          - text: ", exibir fallback (\"Sem bio\" / username); avatar com alt descritivo."
        - listitem [ref=e137]:
          - strong [ref=e138]: RF-03
          - text: Usar as issues reais do repositório. Com busca vazia, mostrar issues abertas e fechadas em ordem decrescente de criação.
          - emphasis [ref=e139]: "Critério:"
          - text: lista ordenada por
          - code [ref=e140]: created_at
          - text: desc; inclui issues abertas e fechadas.
        - listitem [ref=e141]:
          - strong [ref=e142]: RF-04
          - text: Excluir pull requests da listagem.
          - emphasis [ref=e143]: "Critério:"
          - text: nenhum item com
          - code [ref=e144]: pull_request
          - text: aparece.
        - listitem [ref=e145]:
          - strong [ref=e146]: RF-05
          - text: Buscar por texto no título e no corpo usando
          - code [ref=e147]: GET /search/issues
          - text: com qualificador
          - code [ref=e148]: repo:owner/repo is:issue
          - text: .
          - emphasis [ref=e149]: "Critério:"
          - text: resultados correspondem ao termo; paginação remota com
          - code [ref=e150]: page
          - text: e
          - code [ref=e151]: per_page=6
          - text: .
        - listitem [ref=e152]:
          - strong [ref=e153]: RF-06
          - text: Normalizar espaços e tratar a entrada como texto (sem alterar qualificadores).
          - emphasis [ref=e154]: "Critério:"
          - text: termo com múltiplos espaços normalizado; entrada não consegue injetar qualificadores.
        - listitem [ref=e155]:
          - strong [ref=e156]: RF-07
          - text: Debounce de 500 ms, confirmação imediata com Enter, volta à página 1 quando o termo mudar.
          - emphasis [ref=e157]: "Critério:"
          - text: teste automatizado valida debounce e paginação.
        - listitem [ref=e158]:
          - strong [ref=e159]: RF-08
          - text: "Componentes:"
          - code [ref=e160]: ProfileCard
          - text: ","
          - code [ref=e161]: SearchInput
          - text: ","
          - code [ref=e162]: IssueCard
          - text: ","
          - code [ref=e163]: IssueList
          - text: ","
          - code [ref=e164]: Pagination
          - text: ","
          - code [ref=e165]: LoadingState
          - text: ","
          - code [ref=e166]: ErrorState
          - text: .
          - emphasis [ref=e167]: "Critério:"
          - text: todos implementados e reutilizados.
        - listitem [ref=e168]:
          - strong [ref=e169]: RF-09
          - text: Cada card mostra título, data relativa em pt-BR, resumo legível sem Markdown cru, fallback para corpo ausente e número de comentários. Navegação para
          - code [ref=e170]: /post/:number
          - text: sem reload.
          - emphasis [ref=e171]: "Critério:"
          - text: rota alterada sem recarregar página.
        - listitem [ref=e172]:
          - strong [ref=e173]: RF-10
          - text: Detalhe consulta
          - code [ref=e174]: "GET /repos/{owner}/{repo}/issues/{number}"
          - text: ", inclusive em acesso direto."
          - emphasis [ref=e175]: "Critério:"
          - text: URL direta carrega o post.
        - listitem [ref=e176]:
          - strong [ref=e177]: RF-11
          - text: Rejeitar números inválidos e resultados que sejam pull requests.
          - emphasis [ref=e178]: "Critério:"
          - text: exibe estado de erro/404; PR retorna erro.
        - listitem [ref=e179]:
          - strong [ref=e180]: RF-12
          - text: Renderizar Markdown com
          - code [ref=e181]: react-markdown
          - text: ", links seguros, sem HTML cru. Mostrar título, autor, data, comentários, \"Ver no GitHub\" e \"Voltar\". Preservar termo/página ao voltar; acesso direto → Voltar leva à Home."
          - emphasis [ref=e182]: "Critério:"
          - text: Markdown renderizado; links seguros.
        - listitem [ref=e183]:
          - strong [ref=e184]: RF-13
          - text: Distinguir carregamento, sucesso, vazio, 404, falha de rede, outros erros HTTP e rate limit (403/429).
          - emphasis [ref=e185]: "Critério:"
          - text: estados distintos com mensagens.
        - listitem [ref=e186]:
          - strong [ref=e187]: RF-14
          - text: Oferecer "Tentar novamente" nas falhas recuperáveis. Respeitar
          - code [ref=e188]: Retry-After
          - text: ou
          - code [ref=e189]: X-RateLimit-Reset
          - text: . Timeout, cancelamento de consultas obsoletas, impedir respostas antigas sobrescreverem resultados atuais.
          - emphasis [ref=e190]: "Critério:"
          - text: ações de recuperação funcionam; testes cobrem 404 e rate limit.
        - listitem [ref=e191]:
          - strong [ref=e192]: RF-15
          - text: Tailwind adaptando as duas telas a 375/390, 768 e 1280/1440 px. Sem rolagem horizontal da página; rolagem dentro de blocos de código largos.
          - emphasis [ref=e193]: "Critério:"
          - text: verificado em 3 larguras.
        - listitem [ref=e194]:
          - strong [ref=e195]: RF-16
          - text: "Acessibilidade: labels reais, foco visível, contraste, nomes acessíveis, mensagens de estado anunciadas, página 404 com link de retorno."
          - emphasis [ref=e196]: "Critério:"
          - text: navegação por teclado funcional.
      - heading "7. Regras de Negócio (RN)" [level=2] [ref=e197]
      - list [ref=e198]:
        - listitem [ref=e199]:
          - strong [ref=e200]: RN-01
          - text: Fonte real pela API pública do GitHub.
        - listitem [ref=e201]:
          - strong [ref=e202]: RN-02
          - text: Repositório público com pelo menos dez issues.
        - listitem [ref=e203]:
          - strong [ref=e204]: RN-03
          - text: Exclusão de pull requests.
        - listitem [ref=e205]:
          - strong [ref=e206]: RN-04
          - text: Busca vazia = ordem cronológica decrescente.
        - listitem [ref=e207]:
          - strong [ref=e208]: RN-05
          - text: Paginação remota (
          - code [ref=e209]: page
          - text: ","
          - code [ref=e210]: per_page
          - text: ).
        - listitem [ref=e211]:
          - strong [ref=e212]: RN-06
          - text: Normalização e codificação segura da busca.
        - listitem [ref=e213]:
          - strong [ref=e214]: RN-07
          - text: Resumo legível e Markdown seguro.
        - listitem [ref=e215]:
          - strong [ref=e216]: RN-08
          - text: Distinção dos estados da API.
        - listitem [ref=e217]:
          - strong [ref=e218]: RN-09
          - text: Ausência de credenciais na SPA.
        - listitem [ref=e219]:
          - strong [ref=e220]: RN-10
          - text: Configuração centralizada (owner, username, repo, pageSize).
      - heading "8. Escopo" [level=2] [ref=e221]
      - paragraph [ref=e222]: "Incluído: Home, busca, paginação, detalhe, perfil, estados, responsividade, acessibilidade, testes, docs, deploy estático."
      - heading "9. Exclusões" [level=2] [ref=e223]
      - paragraph [ref=e224]: Sem autenticação, backend, banco de dados, edição/criação de posts, token no cliente, SSR.
      - heading "10. Requisitos Não Funcionais" [level=2] [ref=e225]
      - list [ref=e226]:
        - listitem [ref=e227]: TypeScript estrito.
        - listitem [ref=e228]: React + Vite.
        - listitem [ref=e229]: Tailwind CSS.
        - listitem [ref=e230]: Axios para HTTP.
        - listitem [ref=e231]: React Router.
        - listitem [ref=e232]: react-markdown.
        - listitem [ref=e233]: Timeout em requisições; cancelamento de consultas obsoletas.
        - listitem [ref=e234]:
          - text: Sem credenciais no código/README/env
          - code [ref=e235]: VITE_*
          - text: .
        - listitem [ref=e236]: Build estático.
      - heading "11. Decisões de interface (Figma)" [level=2] [ref=e237]
      - list [ref=e238]:
        - listitem [ref=e239]: "Paleta: fundo claro, cards brancos, acento azul/verde (a confirmar via inspeção)."
        - listitem [ref=e240]: "Tipografia: títulos em negrito, corpo regular."
        - listitem [ref=e241]: "Layout: 1440 px desktop; adaptar para 768 e 375/390."
        - listitem [ref=e242]: Cards de post em grade 2 colunas (desktop), 1 coluna (mobile).
        - listitem [ref=e243]: Header com logo "GITHUB BLOG" e barra de busca.
        - listitem [ref=e244]: Perfil com avatar circular, nome, bio, username, empresa, seguidores e link GitHub.
      - blockquote [ref=e245]:
        - paragraph [ref=e246]: "Nota: comparação visual detalhada registrada como pendente até inspeção completa do protótipo."